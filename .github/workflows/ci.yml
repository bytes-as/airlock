# CI is the evidence for every claim the README makes.
#
# That is the organising principle here. This project cannot be deployed to AWS
# by its author, so "it works" has to be demonstrated by things a reader can
# check rather than asserted. Every job below corresponds to a claim:
#
#   test         - the pipeline works, including 50 concurrent jobs
#   race         - the concurrent code is free of data races
#   docker       - the container path works against a real daemon
#   cross        - it builds for the platforms we deploy to
#   terraform    - the IaC is valid and free of known misconfigurations
#   security     - dependencies and code are scanned
#
# A README claim with no corresponding job here is a claim to be suspicious of.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs. A queue of stale CI runs wastes minutes and delays
# the result that actually matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: vet build-tagged code
        # Tagged tests are excluded from the default build, so without this they
        # can rot silently until someone runs them and finds they do not compile.
        run: go vet -tags docker ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: unit and integration tests
        run: go test ./... -timeout 15m -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The scheduler, queue, admission controller and log broker are all
      # concurrent. This is the job that would catch a missing lock, and it
      # could not run on the machine this was written on (no cgo toolchain).
      - name: go test -race
        run: go test -race ./... -timeout 25m

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Written on Windows, deployed on Linux, developed on macOS. Platform
      # assumptions are cheap to introduce and easy to catch here.
      - name: build for every target
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... \
              && echo "ok: $target" \
              || { echo "FAILED: $target"; exit 1; }
          done

  docker:
    name: docker driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ubuntu-latest runners have a Docker daemon, which is what makes this
      # the first place the container path is genuinely exercised.
      - name: docker version
        run: docker version

      - name: pull the test image
        run: docker pull alpine:3.19

      - name: integration tests against a real daemon
        run: go test -tags docker ./internal/driver/docker/ -timeout 20m -v

      - name: no containers left behind
        # The cost guarantee, checked rather than claimed: the tests destroy
        # every environment they create, including on failure.
        run: |
          leftover=$(docker ps -aq --filter "label=ephemera.managed=true" | wc -l)
          echo "ephemera containers remaining: $leftover"
          if [ "$leftover" != "0" ]; then
            docker ps -a --filter "label=ephemera.managed=true"
            exit 1
          fi

  end-to-end:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build
        run: make build

      # The brief's headline question, answered on every push with numbers
      # rather than an assertion.
      - name: 50 concurrent jobs
        run: |
          ./bin/ephemerad --data-dir ./data --addr 127.0.0.1:8080 --workers 6 &
          DAEMON=$!
          trap 'kill $DAEMON 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz >/dev/null && break
            sleep 1
          done

          AGENT_COMMAND="$PWD/bin/ephemera-agent" \
            ./scripts/load-test.sh 50 http://127.0.0.1:8080

      - name: nothing left behind
        run: |
          leftover=$(find ./data/environments -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "environments remaining: $leftover"
          [ "$leftover" = "0" ]

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        # -backend=false because validation needs no state and no credentials.
        # Note this also means `terraform plan` is NOT run: plan requires real
        # AWS credentials, so "validated" here means static validation only.
        # See docs/ARCHITECTURE.md.
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive

  terraform-security:
    name: terraform security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checkov catches the misconfigurations a human review misses: public
      # buckets, unencrypted storage, over-broad IAM. It is the closest thing to
      # a second opinion available without an AWS account to apply into.
      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: deploy/terraform
          framework: terraform
          quiet: true
          soft_fail: false
          # Skips are listed with reasons rather than silenced globally.
          skip_check: >-
            CKV_AWS_144,
            CKV_AWS_18,
            CKV2_AWS_62
          # CKV_AWS_144  cross-region replication - artifacts are ephemeral and
          #              expire in 30 days; replication would double storage cost
          #              for data with no recovery value.
          # CKV_AWS_18   access logging - would need a second bucket and its own
          #              lifecycle; CloudTrail data events cover the audit need
          #              more cheaply.
          # CKV2_AWS_62  event notifications - nothing consumes them yet; adding
          #              an unused notification target is dead configuration.

  security:
    name: dependency and code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: verify dependencies are tidy
        # A go.mod that does not match the source is a supply-chain smell: it
        # means something was added or removed without the manifest agreeing.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  images:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: control plane image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ephemera/control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agent
          push: false
          tags: ephemera/agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
