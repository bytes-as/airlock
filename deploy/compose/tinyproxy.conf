# Egress proxy for job containers.
#
# This is the only route out of the internal `jobs` network, which makes it the
# single auditable chokepoint for everything an agent reaches. Two layers are at
# work and they are deliberately redundant:
#
#   1. The jobs network is `internal: true`, so containers on it have no route
#      off the network at all. Instance metadata is unreachable by construction.
#   2. This config denies the metadata and RFC1918 ranges explicitly, so if
#      someone later makes that network routable — a plausible mistake — the
#      block still holds.
#
# Relying on either alone would be thinner than it looks. Layer 1 is stronger
# but invisible in this file; layer 2 is weaker but states the intent where a
# reviewer will read it.

Port 8888
Listen 0.0.0.0
Timeout 600

# Only the internal Docker network may use the proxy. Without this, anything
# that reaches the container's port gets a free open relay.
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 192.168.0.0/16

# Do not advertise what we are; a proxy banner is free reconnaissance.
DisableViaHeader Yes

LogLevel Info

MaxClients 100

# --- destinations the agent must never reach ---
#
# Cloud instance metadata. This is the one that matters: reaching 169.254.169.254
# from untrusted code is how a sandbox turns into stolen IAM credentials, and it
# is exactly what the brief asks about.
Filter "/etc/tinyproxy/filter"
FilterType fnmatch
FilterURLs Off
FilterDefaultDeny No
