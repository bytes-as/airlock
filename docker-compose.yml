# Local deployment: the whole system, one command.
#
#   docker compose up --build
#   airlock run --image airlock/agent:dev --query "ephemeral environments"
#
# This is developer orchestration, NOT infrastructure as code. It consumes a
# Docker daemon that already exists; it does not provision anything, has no
# state or drift detection, and models no IAM. Terraform under deploy/terraform
# is the IaC deliverable. See docs/ARCHITECTURE.md for why the distinction
# matters here.
#
# The three networks are the point of this file. `jobs` is internal, so
# containers on it have no route off the network at all — instance metadata at
# 169.254.169.254 is unreachable by construction rather than by a firewall rule
# that could be mis-specified. The egress proxy is the only container bridging
# `jobs` and `egress`, so it is the single, auditable way out.

name: airlock

services:
  control-plane:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: airlock/control-plane:${VERSION:-dev}
    ports:
      - "${AIRLOCK_PORT:-8080}:8080"
    environment:
      AIRLOCK_ADDR: ":8080"
      # Mirrored host path - see the volumes section below for why this is not
      # simply "/data".
      AIRLOCK_DATA_DIR: "${PWD}/data"
      AIRLOCK_DRIVER: "docker"
      AIRLOCK_WORKERS: "${AIRLOCK_WORKERS:-8}"
      AIRLOCK_DOCKER_NETWORK: "airlock_jobs"
      AIRLOCK_EGRESS_PROXY: "http://egress-proxy:8888"
      # Two egress points, so jobs rotate between them and the rotation is
      # something a reader can watch rather than take on trust. Both leave this
      # machine through the same address - rotating the *route* is what this
      # code does; having genuinely different addresses is infrastructure
      # (a NAT gateway per AZ, or a commercial pool) that a laptop cannot
      # provide. The region labels are honest stand-ins for that.
      AIRLOCK_EGRESS_PROXY_POOL: "${AIRLOCK_EGRESS_PROXY_POOL:-eu=http://egress-proxy:8888,us=http://egress-proxy-b:8888}"
      AIRLOCK_BASE_URL: "http://localhost:${AIRLOCK_PORT:-8080}"
      # A stable key keeps artifact links valid across restarts. Generated per
      # run if unset, which is fine locally and wrong in production.
      AIRLOCK_SIGNING_KEY: "${AIRLOCK_SIGNING_KEY:-}"
      # token=tenant pairs. Empty means no authentication, which the server
      # warns about loudly at startup.
      AIRLOCK_TOKENS: "${AIRLOCK_TOKENS:-}"
      AIRLOCK_LOG_FORMAT: "${AIRLOCK_LOG_FORMAT:-text}"
      AIRLOCK_MAX_ENV_LIFETIME: "${AIRLOCK_MAX_ENV_LIFETIME:-1h}"
    volumes:
      # The Docker socket is this container's entire authority, and it is a
      # large one: access to the socket is equivalent to root on the host,
      # because it can start a privileged container mounting /.
      #
      # It is here because the control plane's job is to create and destroy
      # containers. The honest mitigations are read-only mounting (below), a
      # distroless image with no shell, and — in any real deployment — a socket
      # proxy that allows only the endpoints this driver actually calls.
      # See docs/SECURITY.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The data directory is bind-mounted at *the same path it has on the
      # host*, which is deliberate and load-bearing.
      #
      # The control plane creates a directory per job and asks the daemon to
      # bind-mount it into the job container. That bind source is resolved by
      # the daemon on the host, not inside this container - so a named volume
      # at /data would give the control plane a path the daemon cannot see, and
      # every job would die with "mounts denied: path is not shared from the
      # host". Mirroring the path makes the two views identical, so a path this
      # container writes is a path the daemon can mount.
      #
      # It also means artifacts land in ./data on the host, where you can just
      # look at them.
      - ${PWD}/data:${PWD}/data
    # The image runs as uid 65532, but the Docker socket is mode 0660 owned by
    # root and a group. Without membership of that group the control plane
    # cannot reach the daemon at all ("permission denied" on the socket) - and
    # running the container as root instead would give away the one piece of
    # hardening that matters most on the container holding the socket.
    #
    # 0 is correct for Docker Desktop (macOS and Windows), where the socket
    # inside the VM is root:root. On Linux it is usually root:docker, so set
    # the group explicitly:
    #   AIRLOCK_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up
    group_add:
      - "${AIRLOCK_DOCKER_GID:-0}"
    networks:
      - control
      # Also on the jobs network so it can reach containers it creates.
      - jobs
    restart: unless-stopped
    healthcheck:
      # Distroless has no shell and no curl, so the check runs the CLI we ship.
      test: ["CMD", "/usr/local/bin/airlock", "stats", "--server", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Builds the agent image so `airlock run --image airlock/agent:dev` works
  # immediately. It exits straight away; it exists to produce the image, not to
  # run a service.
  agent-image:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        VERSION: ${VERSION:-dev}
    image: airlock/agent:${VERSION:-dev}
    command: ["--version"]
    restart: "no"
    networks:
      - control

  # The only route out of the jobs network.
  #
  # tinyproxy rather than squid: a much smaller configuration surface for a
  # component whose entire job is to be an auditable chokepoint. Its config
  # denies the RFC1918 and link-local ranges explicitly, so even if the network
  # were made routable the metadata endpoint stays blocked — defence in depth
  # rather than relying on the network mode alone.
  egress-proxy:
    # Built rather than pulled: the public image is amd64-only and ships a
    # tinyproxy too old for the FilterType directive this config needs, which
    # stopped the proxy starting at all. See Dockerfile.proxy.
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: airlock/egress-proxy:${VERSION:-dev}
    volumes:
      - ./deploy/compose/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./deploy/compose/filter:/etc/tinyproxy/filter:ro
    networks:
      - jobs    # reachable by job containers
      - egress  # has internet access
    restart: unless-stopped

  # A second egress point, identical but separately addressed, so
  # --egress-proxy-pool has something real to rotate across.
  egress-proxy-b:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: airlock/egress-proxy:${VERSION:-dev}
    volumes:
      - ./deploy/compose/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./deploy/compose/filter:/etc/tinyproxy/filter:ro
    networks:
      - jobs
      - egress
    restart: unless-stopped

networks:
  # Where the control plane serves its API.
  control:
    driver: bridge

  # Job containers live here. `internal: true` removes the route to the outside
  # world: this is the egress control, and it is structural.
  jobs:
    name: airlock_jobs
    driver: bridge
    internal: true

  # The proxy's route to the internet. No job container is ever attached here.
  egress:
    driver: bridge

# No named volume: the data directory is a host bind mount (see control-plane
# above), because the daemon has to be able to resolve the paths inside it.
